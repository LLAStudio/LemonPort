name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Tests unitaires
        run: cargo test --locked --lib

      - name: Tests d'intégration
        run: cargo test --locked --test integration -- --test-threads=1

  system-ports:
    name: Ports système (root)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Tester les ports système en root
        run: |
          docker run --rm --user root \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            rust:1.95-bookworm \
            cargo test --locked --test integration system -- --test-threads=1

  coverage:
    name: Couverture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Installer cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Générer le rapport de couverture
        run: cargo llvm-cov --locked --all-targets --html --output-dir coverage -- --test-threads=1

      - name: Publier le rapport
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/html/
          if-no-files-found: error
