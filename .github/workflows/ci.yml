name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Unit tests
        run: cargo test --locked --lib

      - name: Integration tests
        run: cargo test --locked --test integration -- --test-threads=1

      - name: Check English UI strings
        if: runner.os == 'Linux'
        run: python3 scripts/check_english.py

  system-ports:
    name: System ports (root)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run privileged system-port tests
        run: |
          docker run --rm --user root \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            rust:1.95-bookworm \
            cargo test --locked --test integration system -- --test-threads=1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        env:
          MIN_LINE_COVERAGE: 80
        run: |
          cargo llvm-cov --locked --all-targets --no-report -- --test-threads=1
          cargo llvm-cov report --html --output-dir coverage
          cargo llvm-cov report --lcov \
            --output-path coverage/lcov.info \
            --fail-under-lines "$MIN_LINE_COVERAGE"

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/html/
            coverage/lcov.info
          if-no-files-found: error
