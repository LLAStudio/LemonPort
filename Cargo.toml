[package]
name = "lemon-port"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "🍋 Instant TCP port inspector and killer for the terminal"
authors = ["LLAStudio"]
license = "MIT"
repository = "https://github.com/LLAStudio/LemonPort"
readme = "README.md"
keywords = ["port", "tcp", "cli", "tui", "devtools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
netstat2 = "0.11"
open = "5.4"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.40"
toml = "1.2"

[dev-dependencies]
# 0.9.0 returns garbage from ConPTY on Windows (wezterm#6783); 0.8.1 is reliable there.
portable-pty = "=0.8.1"
serde_json = "1.0"
vt100 = "0.18"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
